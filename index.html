<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/clear-list.css">
  <link rel="stylesheet" href="style/catalog.css">
  <link rel="stylesheet" href="style/container.css">
  <link rel="stylesheet" href="style/title.css">
  <link rel="stylesheet" href="style/card.css">
  <link rel="stylesheet" href="style/products.css">
  <link rel="stylesheet" href="style/compound.css">
  <link rel="stylesheet" href="style/button.css">
  <link rel="stylesheet" href="style/footer.css">
  <link rel="stylesheet" href="style/modal.css">

</head>

<body>
  <main class="catalog">
    <div class="container catalog__container">
      <h1 class="title catalog__title">Выбери свой продукт</h1>
      <button id="change-color-card-btn">Сменить цвет карточки</button>
      <button id="change-color-cards-btn">Сменить цвет карточек</button>
      <button id="reset-color-cards-btn">Сбросить цвет карточек</button>
      <button id="open-google-btn">Открыть страницу google.com</button>
      <button id="log-message-btn">Вывести сообщение в консоль лог</button>
      <button class="color-button">Цветная кнопка</button>
      <button id="open-modal-btn" type="button">
  Регистрация
</button>
      <ul class="products clear-list">
        <template class="card-template">
          <li class="products__item card">
            <img src="" alt="" class="card__images" width="290" height="245">
            <span class="card__category"></span>
            <h2 class="card__name"></h2>
            <p class="card__description"></p>

            <div class="card__compound compound">
              <span class="compound__name">Состав:</span>
              <ul class="compound__list"></ul>
            </div>

            <div class="card__price">
              <p class="card__price-label">Цена:</p>
              <span class="card__price-value"></span>
            </div>
          </li>
        </template>

        <template class="compound-template">
          <li class="compound__item"></li>
        </template>

      </ul>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__container">
      <div class="footer__about">
        <h2 class="footer__title">Product Cards</h2>
        <p class="footer__description">У Нас Самые Лучшие Продукты Для Кожи!</p>

        <div class="footer__socials">
          <a href="#" class="footer__social" aria-label="Telegram">
            <img src="img/TG_icon.png" alt="Telegram">
          </a>

          <a href="#" class="footer__social" aria-label="VK">
            <img src="img/VK_icon.png" alt="VK">
          </a>
        </div>
      </div>

      <div class="footer__subscribe">
        <h2 class="footer__subscribe-title">Подпишись на наши акции:</h2>

        <form class="subscribe-form">
          <input class="subscribe-form__input" name="email" type="email" placeholder="Введи Email..." aria-label="Email" required>
          <span class="subscribe-form__divider"></span>
          <button class="subscribe-form__button" type="submit">Подписаться</button>
        </form>
      </div>

      <nav class="footer__nav">
        <h2 class="footer__nav-title">Быстрые ссылки</h2>
        <a href="#" class="footer__nav-link">Главная</a>
        <a href="#" class="footer__nav-link">Магазин</a>
        <a href="#" class="footer__nav-link">Контакты</a>
      </nav>

      <div class="footer__bottom">
        <span class="footer__bottom-line"></span>
        <p class="footer__copyright">www.product-cards.com©all right reserve</p>
      </div>
    </div>
  </footer>

  <!-- Затемнение страницы -->
<div class="overlay"></div>

<!-- Модальное окно -->
<div class="modal">
  <div class="modal__content">

    <button class="modal__close-btn" type="button">
      &times;
    </button>

    <h2 class="modal__title">Регистрация</h2>

    <form class="registration-form" novalidate>

      <label for="first-name">Имя</label>
      <input
        id="first-name"
        name="firstName"
        type="text"
        placeholder="Введите имя"
        minlength="2"
        required
      >

      <label for="last-name">Фамилия</label>
      <input
        id="last-name"
        name="lastName"
        type="text"
        placeholder="Введите фамилию"
        minlength="2"
        required
      >

      <label for="birth-date">Дата рождения</label>
      <input
        id="birth-date"
        name="birthDate"
        type="date"
        required
      >

      <label for="login">Логин</label>
      <input
        id="login"
        name="login"
        type="text"
        placeholder="Придумайте логин"
        minlength="4"
        required
      >

      <label for="password">Пароль</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Введите пароль"
        minlength="8"
        required
      >

      <label for="repeat-password">Повторите пароль</label>
      <input
        id="repeat-password"
        name="repeatPassword"
        type="password"
        placeholder="Повторите пароль"
        minlength="8"
        required
      >

      <button type="submit">
        Зарегистрироваться
      </button>

    </form>
  </div>
</div>

  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="homework-9.js"></script>
  <script type="module" src="homework-10.js"></script>
  <script type="module" src="homework-11.js"></script>
</body>

</html>
