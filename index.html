<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/clear-list.css">
  <link rel="stylesheet" href="style/catalog.css">
  <link rel="stylesheet" href="style/container.css">
  <link rel="stylesheet" href="style/title.css">
  <link rel="stylesheet" href="style/card.css">
  <link rel="stylesheet" href="style/products.css">
  <link rel="stylesheet" href="style/compound.css">
  <link rel="stylesheet" href="style/button.css">

</head>

<body>
  <main class="catalog">
    <div class="container catalog__container">
      <h1 class="title catalog__title">Выбери свой продукт</h1>
      <button id="change-color-card-btn">Сменить цвет карточки</button>
      <button id="change-color-cards-btn">Сменить цвет карточек</button>
      <button id="reset-color-cards-btn">Сбросить цвет карточек</button>
      <button id="open-google-btn">Открыть страницу google.com</button>
      <button id="log-message-btn">Вывести сообщение в консоль лог</button>
      <button class="color-button">Цветная кнопка</button>
      <ul class="products clear-list">
        <template class="card-template">
          <li class="products__item card">
            <img src="" alt="" class="card__images" width="290" height="245">
            <span class="card__category"></span>
            <h2 class="card__name"></h2>
            <p class="card__description"></p>
            
            <div class="card__compound compound">
              <span class="compound__name">Состав:</span>
              <ul class="compound__list"></ul>
            </div>
            
            <div class="card__price">
              <b class="card__price-label">:</b>
              <span class="card__price-value"></span>
            </div>
          </li>
        </template>

        <template class="compound-template">
          <li class="compound__item"></li>
        </template>

      </ul>
    </div>
  </main>
  <script src="main.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="homework-9.js"></script>
  <script type="module" src="homework-10.js"></script>
</body>

</html>
